<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Морской бой в клетку</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Neucha&display=swap">
<style>
/* Layout concept: a page of a squared school notebook with a red margin; boards are drawn on it in ballpoint and red pen. Dark theme: the same game in chalk on a classroom board. */
:root {
  --paper: #f7f9fc; --sq: #dfe8f3; --line: #b9cce2; --ink: #22307f; --soft: #56648f;
  --pen: #cf1f2e; --margin: #eb9aa2; --tint: #e9eef8; --on-ink: #ffffff; --warn-bg: #fdecec;
  --hand: "Neucha", "Segoe Print", "Comic Sans MS", cursive;
  --text: "Golos Text", "Segoe UI", Roboto, Arial, sans-serif;
  --gut: 16px; --sketch: 255px 18px 225px 18px / 18px 225px 18px 255px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #1a2b27; --sq: #233730; --line: #456357; --ink: #eef3e7; --soft: #adc0b2;
  --pen: #ff8d7c; --margin: #6d4542; --tint: #284038; --on-ink: #1a2b27; --warn-bg: #3c2c29; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #1a2b27; --sq: #233730; --line: #456357; --ink: #eef3e7; --soft: #adc0b2;
  --pen: #ff8d7c; --margin: #6d4542; --tint: #284038; --on-ink: #1a2b27; --warn-bg: #3c2c29; color-scheme: dark }

html, body { min-height: 100%; }
body {
  background-color: var(--paper); color: var(--ink); font: 400 15px/1.5 var(--text);
  background-image:
    linear-gradient(90deg, transparent calc(var(--mx) - 2px), var(--margin) calc(var(--mx) - 2px), var(--margin) var(--mx), transparent var(--mx)),
    linear-gradient(var(--sq) 1px, transparent 1px), linear-gradient(90deg, var(--sq) 1px, transparent 1px);
  background-size: 100% 100%, 22px 22px, 22px 22px;
  --mx: 8px;
  padding-left: max(var(--gut), env(safe-area-inset-left, 0px));
  padding-right: max(var(--gut), env(safe-area-inset-right, 0px));
  padding-block: 18px 40px;
}
@media (min-width: 760px) { body { --mx: 44px; --gut: 68px; padding-block: 28px 56px; } }
main { max-width: 1040px; margin: 0 auto; display: grid; gap: 18px; }
h1, h2, h3, .hand { font-family: var(--hand); font-weight: 400; margin: 0; text-wrap: balance; }
p { margin: 0; max-width: 62ch; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--pen); outline-offset: 2px; }

.btn {
  font: 400 20px/1.15 var(--hand); padding: 11px 20px 12px; cursor: pointer; background: var(--paper);
  border: 2px solid var(--ink); border-radius: var(--sketch); transition: transform .12s, background .12s;
}
.btn:hover { background: var(--tint); transform: rotate(-.6deg); }
.btn:active { transform: translateY(1px); }
.btn.main { background: var(--ink); color: var(--on-ink); }
.btn.main:hover { background: var(--ink); transform: rotate(-.6deg) scale(1.015); }
.btn.quiet { border-color: transparent; background: transparent; text-decoration: underline; text-underline-offset: 3px; padding-inline: 4px; font-size: 18px; }
.btn.quiet:hover { background: transparent; color: var(--pen); }
.btn[disabled] { opacity: .5; cursor: default; transform: none; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* Home */
.home { display: grid; gap: 28px; align-items: start; }
@media (min-width: 760px) { .home { grid-template-columns: minmax(0, 1fr) minmax(0, 400px); gap: 48px; padding-top: 18px; } }
.home-text { display: grid; gap: 22px; min-width: 0; }
.home h1 { font-size: clamp(50px, 10vw, 84px); line-height: .98; }
.home h1 span { display: inline-block; position: relative; }
.home h1 svg { position: absolute; left: 0; bottom: -10px; width: 100%; height: 14px; overflow: visible; }
.lead { font-size: 17px; }
.join { display: grid; gap: 7px; }
.join label { font-weight: 500; }
#code-input {
  width: 8.5ch; font: 400 26px/1.2 var(--hand); letter-spacing: .1em; padding: 7px 12px; background: var(--paper);
  border: 2px solid var(--ink); border-radius: var(--sketch);
}
.hint { color: var(--soft); font-size: 14px; }
.err { color: var(--pen); font-size: 14px; }
.notice { background: var(--warn-bg); border: 1.5px dashed var(--pen); padding: 10px 13px; border-radius: 3px; max-width: 62ch; }
.sample { display: grid; gap: 8px; }
.sample figcaption { color: var(--soft); font-size: 14px; }
figure { margin: 0; }

/* Game header */
.top { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; }
.top .name { font: 400 24px/1 var(--hand); }
.chips { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13.5px; color: var(--soft); margin-right: auto; }
@media (max-width: 759px) { .top { justify-content: space-between; } .chips { order: 3; width: 100%; margin-right: 0; } }
.chip { display: inline-flex; align-items: center; gap: 6px; }
.chip i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--soft); }
.chip.on i { background: var(--ink); border-color: var(--ink); }
.chip.off { color: var(--pen); } .chip.off i { border-color: var(--pen); }

.status { display: grid; gap: 1px; min-height: 66px; }
.status .big { font: 400 clamp(32px, 6vw, 44px)/1.05 var(--hand); }
.status.mine .big { color: var(--pen); }
.status .sub { color: var(--soft); min-height: 1.5em; }

/* Boards */
.board { container-type: inline-size; display: grid; grid-template-columns: 7% minmax(0, 1fr); grid-template-rows: auto auto; width: 100%; max-width: 100%; user-select: none; -webkit-user-select: none; }
.letters { display: grid; grid-template-columns: repeat(10, 1fr); }
.nums { display: grid; grid-template-rows: repeat(10, 1fr); }
.letters span, .nums span { font: 400 clamp(10px, 4.6cqw, 21px)/1.25 var(--hand); text-align: center; color: var(--soft); display: flex; align-items: center; justify-content: center; }
.field { position: relative; aspect-ratio: 1; max-width: 100%; background: var(--paper); outline: 2px solid var(--ink); outline-offset: -1px; }
.cells { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(10, 1fr); grid-template-rows: repeat(10, 1fr); }
.cell { border: 0; padding: 0; margin: 0; background: none; min-width: 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); border-radius: 0; }
.cell:nth-child(10n) { border-right: 0; } .cell:nth-child(n+91) { border-bottom: 0; }
.field svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.field.armed { outline-color: var(--pen); outline-width: 3px; }
.field.armed .cell[data-open="1"] { cursor: crosshair; }
.field.armed .cell[data-open="1"]:hover { background: var(--tint); }
.field.armed .cell:focus-visible { outline-offset: -3px; }
.field.setup { touch-action: none; cursor: grab; }
.field.setup.dragging { cursor: grabbing; }
.field.shake { animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-5px) } 75% { transform: translateX(5px) } }

.s-ship { fill: none; stroke: var(--ink); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.s-ghost { fill: none; stroke: var(--ink); stroke-width: 2.6; stroke-dasharray: 6 5; }
.s-ghost.bad { stroke: var(--pen); }
.s-rest { fill: none; stroke: var(--soft); stroke-width: 2.2; stroke-dasharray: 5 5; }
.s-sunk { stroke: var(--pen); stroke-width: 2.6; stroke-linecap: round; }
.s-hatch { stroke: var(--pen); stroke-width: 1.3; opacity: .55; }
.m-hit { fill: none; stroke: var(--pen); stroke-width: 3.2; stroke-linecap: round; }
.m-miss { fill: var(--ink); }
.m-auto { fill: var(--soft); opacity: .55; }
.m-wait { fill: none; stroke: var(--soft); stroke-width: 2; stroke-dasharray: 4 4; }
.m-last { fill: none; stroke: var(--pen); stroke-width: 1.6; opacity: .75; }
.fresh.m-hit { stroke-dasharray: 1; animation: draw .22s ease-out both; }
.fresh.m-hit + .fresh.m-hit { animation-delay: .16s; }
.fresh.m-miss { transform-box: fill-box; transform-origin: center; animation: pop .22s ease-out both; }
@keyframes draw { from { stroke-dashoffset: 1 } to { stroke-dashoffset: 0 } }
@keyframes pop { from { transform: scale(0) } to { transform: scale(1) } }

/* Arena */
.arena { display: grid; gap: 22px; align-items: start; }
.col { display: grid; gap: 8px; min-width: 0; }
.col h2 { font-size: 22px; line-height: 1.1; }
.tally { display: flex; flex-wrap: wrap; gap: 5px 7px; align-items: center; min-height: 14px; }
.tally b { display: flex; gap: 1px; }
.tally b i { width: 10px; height: 10px; border: 1.5px solid var(--ink); }
.tally b.dead i { border-color: var(--pen); background: var(--pen); opacity: .75; }
.log { display: grid; gap: 1px; font-size: 13.5px; color: var(--soft); list-style: none; margin: 0; padding: 0; }
.log li:first-child { color: var(--ink); }
.setup-panel { display: grid; gap: 16px; min-width: 0; }
.invite { display: grid; gap: 9px; padding: 13px 15px 15px; border: 2px dashed var(--ink); border-radius: var(--sketch); }
.invite .num { font: 400 46px/1 var(--hand); letter-spacing: .12em; user-select: all; -webkit-user-select: all; }
.steps { display: grid; gap: 5px; color: var(--soft); font-size: 14.5px; }
#copy-fallback { width: 100%; padding: 7px; font-size: 14px; background: var(--paper); border: 1px solid var(--line); }

.arena[data-phase="place"] .enemy { display: none; }
.arena[data-phase="place"] .own .tally, .arena[data-phase="place"] .own .log { display: none; }
.arena[data-phase="battle"] .setup-panel { display: none; }
.own { grid-template-columns: 44% minmax(0, 1fr); column-gap: 14px; align-items: start; }
.own h2 { grid-column: 1 / -1; }
.own .side { display: grid; gap: 8px; align-content: start; min-width: 0; }
.arena[data-phase="place"] .own { grid-template-columns: minmax(0, 1fr); }
.arena[data-phase="place"] .own h2 { display: none; }
@media (min-width: 760px) {
  .arena { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 34px; }
  .own { grid-template-columns: minmax(0, 1fr); }
  .own .side { grid-template-columns: minmax(0, 1fr); }
  .arena[data-phase="place"] { grid-template-columns: minmax(0, 480px) minmax(0, 1fr); }
}
.end { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.center { display: grid; gap: 14px; max-width: 62ch; padding-top: 30px; }
.center h1 { font-size: 40px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<main id="app"></main>

<script>
(() => {
'use strict';
/* ---------- Rules ---------- */
const N = 10, LET = 'АБВГДЕЖЗИК', FLEET = [4, 3, 3, 2, 2, 2, 1, 1, 1, 1], TOTAL = 20;
const coord = c => LET[c % N] + (Math.floor(c / N) + 1);
const around = c => {
  const x = c % N, y = Math.floor(c / N), out = [];
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    const a = x + dx, b = y + dy;
    if ((dx || dy) && a >= 0 && a < N && b >= 0 && b < N) out.push(b * N + a);
  }
  return out;
};
const pieceFits = (cells, others) => {
  const busy = new Set();
  others.forEach(s => s.forEach(c => { busy.add(c); around(c).forEach(a => busy.add(a)); }));
  return cells.every(c => c >= 0 && c < N * N && !busy.has(c));
};
const lay = (x, y, len, vertical) => {
  const out = [];
  for (let i = 0; i < len; i++) {
    const a = vertical ? x : x + i, b = vertical ? y + i : y;
    if (a < 0 || a >= N || b < 0 || b >= N) return null;
    out.push(b * N + a);
  }
  return out;
};
const randomFleet = () => {
  for (;;) {
    const ships = [];
    let failed = false;
    for (const len of FLEET) {
      let placed = false;
      for (let t = 0; t < 300 && !placed; t++) {
        const c = lay(Math.floor(Math.random() * N), Math.floor(Math.random() * N), len, Math.random() < .5);
        if (c && pieceFits(c, ships)) { ships.push(c); placed = true; }
      }
      if (!placed) { failed = true; break; }
    }
    if (!failed) return ships;
  }
};
const newPlayer = (g, fleet) => ({ g, ready: false, shots: [], ans: [], sunk: [], rematch: 0, reveal: null, fleet });
const blank = g => newPlayer(g, null);
const firstRole = g => (g % 2 ? 'guest' : 'host');

/* Fill in answers to the opponent's shots. Answers: 0 miss, 1 wounded, 2 sunk. */
function answer(p, shots) {
  let changed = false;
  while (p.ans.length < shots.length) {
    const k = p.ans.length, s = shots[k], seen = new Set(shots.slice(0, k + 1));
    const ship = p.fleet.find(c => c.includes(s));
    if (!ship) p.ans.push(0);
    else if (ship.every(c => seen.has(c))) {
      p.ans.push(2);
      if (!p.sunk.some(x => x[0] === ship[0])) p.sunk.push(ship);
    } else p.ans.push(1);
    changed = true;
  }
  return changed;
}

/* Replay both players' shots in order. The whole game follows from these two lists. */
function derive(a, b, aFirst) {
  let who = aFirst ? 'a' : 'b', i = 0, j = 0, last = null, winner = null, waiting = false;
  const aHits = new Set(), bHits = new Set(), events = [];
  for (;;) {
    const mine = who === 'a', k = mine ? i : j, shots = mine ? a.shots : b.shots, ans = mine ? b.ans : a.ans;
    if (k >= shots.length) break;
    const r = ans[k];
    if (r === undefined) { waiting = true; break; }
    const c = shots[k];
    last = { who, c, r };
    events.push(last);
    if (mine) i++; else j++;
    if (r > 0) (mine ? aHits : bHits).add(c);
    if (aHits.size >= TOTAL) { winner = 'a'; break; }
    if (bHits.size >= TOTAL) { winner = 'b'; break; }
    if (r === 0) who = mine ? 'b' : 'a';
  }
  return { turn: who, waiting, winner, last, events };
}

/* ---------- Storage (never required) ---------- */
const mem = {};
const load = (area, k) => { try { const v = window[area].getItem(k); return v ? JSON.parse(v) : null; } catch { return mem[area + k] || null; } };
const save = (area, k, v) => { try { window[area].setItem(k, JSON.stringify(v)); } catch { mem[area + k] = v; } };
const drop = (area, k) => { try { window[area].removeItem(k); } catch { delete mem[area + k]; } };
const uid = () => Math.random().toString(36).slice(2, 12);

/* ---------- Messages from the other player are untrusted ---------- */
const ints = (a, max, lim) => Array.isArray(a) && a.length <= lim && a.every(n => Number.isInteger(n) && n >= 0 && n <= max);
const shipsOk = (a, lim) => Array.isArray(a) && a.length <= lim && a.every(s => ints(s, 99, 4) && s.length > 0);
function clean(x) {
  if (!x || typeof x !== 'object') return null;
  if (typeof x.id !== 'string' || x.id.length > 20 || (x.role !== 'host' && x.role !== 'guest')) return null;
  if (!Number.isInteger(x.seq) || !Number.isInteger(x.g) || x.g < 0 || !Number.isInteger(x.rematch)) return null;
  if (!ints(x.shots, 99, 300) || !ints(x.ans, 2, 300) || !shipsOk(x.sunk, 10)) return null;
  if (x.reveal !== null && !shipsOk(x.reveal, 10)) return null;
  return { code: String(x.code), id: x.id, role: x.role, seq: x.seq, g: x.g, ready: !!x.ready, shots: x.shots, ans: x.ans, sunk: x.sunk, rematch: x.rematch, reveal: x.reveal };
}

/* ---------- Connection: MQTT over WebSocket, free public servers ----------
   Each player publishes their full state to every server they can reach, and
   reads from all of them, so play works as long as both share one server. */
const BROKERS = window.MB_BROKERS || [
  'wss://broker.hivemq.com:8884/mqtt',
  'wss://broker.emqx.io:8084/mqtt',
  'wss://mqtt.eclipseprojects.io:443/mqtt',
  'wss://test.mosquitto.org:8081/mqtt'
];
const NS = 'morskoi-boi-kletka/v1/';
const te = new TextEncoder(), td = new TextDecoder();
const mqStr = s => { const b = te.encode(s); return [b.length >> 8, b.length & 255, ...b]; };
const mqPkt = (first, body) => {
  const len = []; let n = body.length;
  do { let d = n % 128; n = Math.floor(n / 128); if (n) d |= 128; len.push(d); } while (n);
  return new Uint8Array([first, ...len, ...body]);
};

function mqttLink(url, topicFilter, onOpen, onMessage) {
  let ws = null, closed = false, alive = false, timer = 0, ping = 0, tries = 0, heard = 0, buf = new Uint8Array(0);
  const send = bytes => { if (alive && ws && ws.readyState === 1) ws.send(bytes); };
  const stop = () => { alive = false; clearInterval(ping); clearTimeout(timer); };
  const retry = () => {
    stop();
    if (closed) return;
    timer = setTimeout(open, Math.min(20000, 1500 * 2 ** tries++) * (.7 + Math.random() * .6));
  };
  const onPacket = (type, flags, p) => {
    if (type === 2) {
      if (p[1] !== 0) { ws.close(); return; }
      alive = true; tries = 0;
      send(mqPkt(0x82, [0, 1, ...mqStr(topicFilter), 0]));
      onOpen();
    } else if (type === 3) {
      const tl = (p[0] << 8) | p[1];
      const start = 2 + tl + ((flags >> 1) & 3 ? 2 : 0);
      onMessage(td.decode(p.subarray(start)), !!(flags & 1));
    }
  };
  function open() {
    if (closed) return;
    stop(); buf = new Uint8Array(0);
    try { ws = new WebSocket(url, 'mqtt'); } catch { retry(); return; }
    const sock = ws;
    sock.binaryType = 'arraybuffer';
    const guard = setTimeout(() => { if (!alive) sock.close(); }, 9000);
    sock.onopen = () => {
      sock.send(mqPkt(0x10, [...mqStr('MQTT'), 4, 2, 0, 60, ...mqStr('mb' + uid() + uid())]));
      heard = Date.now();
      ping = setInterval(() => {
        if (Date.now() - heard > 75000) { sock.close(); return; }
        send(new Uint8Array([0xC0, 0]));
      }, 25000);
    };
    sock.onmessage = e => {
      heard = Date.now();
      const chunk = new Uint8Array(e.data), joined = new Uint8Array(buf.length + chunk.length);
      joined.set(buf); joined.set(chunk, buf.length); buf = joined;
      for (;;) {
        let i = 1, mult = 1, len = 0, b;
        do {
          if (i >= buf.length) return;
          b = buf[i++]; len += (b & 127) * mult; mult *= 128;
        } while (b & 128);
        if (buf.length < i + len) return;
        onPacket(buf[0] >> 4, buf[0] & 15, buf.subarray(i, i + len));
        buf = buf.subarray(i + len);
      }
    };
    sock.onclose = () => { clearTimeout(guard); if (ws === sock) retry(); };
    sock.onerror = () => {};
  }
  open();
  return {
    get alive() { return alive; },
    publish(topic, text) { send(mqPkt(0x31, [...mqStr(topic), ...te.encode(text)])); },
    nudge() { if (!closed && (!ws || ws.readyState > 1)) { tries = 0; open(); } },
    close() { closed = true; stop(); if (ws) { const s = ws; ws = null; try { s.close(); } catch {} } }
  };
}

function mqttTransport(code, role, cb) {
  const base = NS + code + '/', topic = base + role;
  let last = null, lastHeard = 0;
  const push = l => { if (last) l.publish(topic, last); };
  const links = BROKERS.map(url => {
    const l = mqttLink(url, base + '+', () => { push(l); cb.onChange(); }, (text, retained) => {
      let st; try { st = JSON.parse(text); } catch { return; }
      const live = !retained;
      if (live && st && st.role && st.role !== role) {
        if (Date.now() - lastHeard > 50000) links.forEach(push);
        lastHeard = Date.now();
      }
      cb.onState(st);
    });
    return l;
  });
  const beat = setInterval(() => links.forEach(push), 20000);
  const wake = () => { links.forEach(l => { l.nudge(); push(l); }); };
  addEventListener('online', wake);
  document.addEventListener('visibilitychange', wake);
  return {
    kind: 'mqtt',
    linked: () => links.some(l => l.alive),
    peerOnline: () => Date.now() - lastHeard < 50000,
    publish(st) { last = JSON.stringify(st); links.forEach(push); },
    close() {
      clearInterval(beat); removeEventListener('online', wake);
      document.removeEventListener('visibilitychange', wake); links.forEach(l => l.close());
    }
  };
}

/* Inside the Claude viewer the page cannot open sockets; presence in a shared room carries the state. */
async function roomTransport(code, cb) {
  const room = await window.claude.use('room');
  if (!room) throw new Error('no room');
  let r;
  try { r = await room.join('mb-' + code); }
  catch (e) { if (e && e.code === 'not_permitted') r = room; else throw e; }
  let dead = false;
  const others = () => r.peers().filter(p => !p.sameTab && p.presence && p.presence.s && p.presence.s.code === code);
  const off = r.onPeers(() => { if (!dead) { others().forEach(p => cb.onState(p.presence.s)); cb.onChange(); } },
    () => { dead = true; cb.onDead(); });
  return {
    kind: 'room',
    linked: () => !dead && r.connected(),
    peerOnline: () => others().length > 0,
    publish(st) { r.presence({ s: st }).catch(() => {}); },
    close() { off(); if (r !== room) r.leave().catch(() => {}); else room.presence({ s: null }).catch(() => {}); }
  };
}

/* Practice opponent: plays through the same rules as a real player. */
function botTransport(cb) {
  let bot = newPlayer(0, randomFleet()), seq = 0, timer = 0, human = null, stopped = false;
  bot.ready = true;
  const emit = () => setTimeout(() => {
    if (stopped) return;
    const { fleet, ...pub } = bot;
    cb.onState({ ...pub, code: 'bot', id: 'bot', role: 'guest', seq: ++seq });
  }, 0);
  const pick = () => {
    const d = derive(bot, human, firstRole(bot.g) === 'guest');
    const known = new Set(bot.shots), hits = [];
    d.events.filter(e => e.who === 'a' && e.r > 0).forEach(e => hits.push(e.c));
    human.sunk.forEach(s => s.forEach(c => around(c).forEach(a => known.add(a))));
    const open = hits.filter(c => !human.sunk.some(s => s.includes(c)));
    const free = c => c >= 0 && c < 100 && !known.has(c);
    if (open.length) {
      const opts = [];
      open.forEach(c => {
        const x = c % N;
        if (x > 0) opts.push(c - 1); if (x < 9) opts.push(c + 1);
        opts.push(c - N, c + N);
      });
      let list = opts.filter(free);
      if (open.length > 1) {
        const horiz = Math.abs(open[0] - open[1]) < N;
        list = list.filter(c => open.some(h => (horiz ? Math.abs(c - h) === 1 : Math.abs(c - h) === N)));
      }
      if (list.length) return list[Math.floor(Math.random() * list.length)];
    }
    const all = [...Array(100).keys()].filter(free);
    const even = all.filter(c => (c % N + Math.floor(c / N)) % 2 === 0);
    const from = even.length ? even : all;
    return from[Math.floor(Math.random() * from.length)];
  };
  return {
    kind: 'bot',
    linked: () => true,
    peerOnline: () => true,
    publish(st) {
      human = st;
      clearTimeout(timer);
      if (st.rematch === bot.g + 1) { bot = newPlayer(bot.g + 1, randomFleet()); bot.ready = true; }
      if (st.g !== bot.g || !st.ready) { emit(); return; }
      answer(bot, st.shots);
      const d = derive(bot, st, firstRole(bot.g) === 'guest');
      if (d.winner && !bot.reveal) bot.reveal = bot.fleet;
      emit();
      if (d.turn === 'a' && !d.waiting && !d.winner) {
        timer = setTimeout(() => { bot.shots.push(pick()); emit(); }, 800);
      }
    },
    close() { stopped = true; clearTimeout(timer); }
  };
}

/* ---------- App state ---------- */
const app = document.getElementById('app');
let S = null, T = null, connectToken = 0, netBlocked = false, tickT = 0;
const inClaude = !!(window.claude && window.claude.use);

const oppNow = () => (S.opp && S.opp.g === S.me.g ? S.opp : blank(S.me.g));
const key = () => 'mb:' + S.code + ':' + S.role;
const store = () => {
  if (S.mode !== 'net') return;
  const { code, role, id, seq, me } = S;
  save('localStorage', key(), { code, role, id, seq, me, opp: S.opp });
  save('sessionStorage', 'mb:tab', { code, role });
  save('localStorage', 'mb:last', { code, role, at: Date.now() });
};
const pub = () => {
  const { fleet, ...rest } = S.me;
  return { ...rest, code: S.code, id: S.id, role: S.role, seq: S.seq };
};
const send = () => { if (T && !S.probing) T.publish(pub()); };
function commit() { S.seq++; store(); send(); render(); }

function onRemote(raw) {
  if (!S) return;
  const st = clean(raw);
  if (!st || (S.mode === 'net' && st.code !== S.code)) return;
  if (st.role === S.role) {
    if (st.id !== S.id && S.probing && !S.full) {
      if (S.role === 'host') { startHost(); return; }
      S.full = true; render();
    }
    return;
  }
  if (S.opp && S.opp.id === st.id && st.seq <= S.opp.seq) return;
  S.opp = st;
  sync();
}

function sync() {
  const me = S.me, o = S.opp;
  let changed = false;
  if (o && me.rematch === me.g + 1 && (o.rematch === me.g + 1 || o.g === me.g + 1)) {
    S.me = newPlayer(me.g + 1, randomFleet());
    commit();
    return;
  }
  if (o && o.g === me.g && me.ready && o.ready) {
    if (answer(me, o.shots)) changed = true;
    const d = derive(me, o, firstRole(me.g) === S.role);
    if (d.winner && !me.reveal) { me.reveal = me.fleet; changed = true; }
  }
  if (changed) commit(); else { store(); render(); }
}

async function connect() {
  const token = ++connectToken;
  if (T) { T.close(); T = null; }
  const cb = { onState: onRemote, onChange: () => { if (S) renderChips(); }, onDead: () => { if (S) { S.netError = true; render(); } } };
  if (S.mode === 'bot') T = botTransport(cb);
  else if (inClaude) {
    try {
      const t = await roomTransport(S.code, cb);
      if (token !== connectToken) { t.close(); return; }
      T = t;
    } catch { if (token === connectToken && S) { S.netError = true; render(); } return; }
  } else T = mqttTransport(S.code, S.role, cb);
  if (S.probing) {
    /* Listen first: retained messages reveal whether this seat is already taken. */
    const t0 = Date.now();
    let since = 0;
    const wait = setInterval(() => {
      if (token !== connectToken || !S) { clearInterval(wait); return; }
      if (T.linked() && !since) since = Date.now();
      if ((since && Date.now() - since > 1500) || Date.now() - t0 > 12000) {
        clearInterval(wait);
        S.probing = false;
        send();
      }
    }, 150);
  } else send();
  render();
}

function begin(state) {
  S = state;
  buildGame();
  render();
  connect();
  clearInterval(tickT);
  tickT = setInterval(() => { if (S) renderChips(); }, 3000);
}

function startHost() {
  const code = String(100000 + Math.floor(Math.random() * 900000));
  begin({ mode: 'net', code, role: 'host', id: uid(), seq: 1, me: newPlayer(0, randomFleet()), opp: null, probing: true });
  store();
}
function joinCode(code) {
  const saved = load('localStorage', 'mb:' + code + ':guest');
  if (saved) { begin({ ...saved, mode: 'net' }); return; }
  begin({ mode: 'net', code, role: 'guest', id: uid(), seq: 1, me: newPlayer(0, randomFleet()), opp: null, probing: true });
  store();
}
function resume(code, role) {
  const saved = load('localStorage', 'mb:' + code + ':' + role);
  if (!saved) return false;
  begin({ ...saved, mode: 'net' });
  return true;
}
function startBot() {
  begin({ mode: 'bot', code: 'bot', role: 'host', id: uid(), seq: 1, me: newPlayer(0, randomFleet()), opp: null });
}
function leave() {
  connectToken++;
  if (T) T.close();
  T = null; S = null;
  clearInterval(tickT);
  drop('sessionStorage', 'mb:tab');
  document.title = BASE_TITLE;
  try { if (location.hash) history.replaceState(null, '', location.pathname + location.search); } catch {}
  renderHome();
}

/* ---------- Drawing: everything is pen on squared paper ---------- */
let boardUid = 0;
const noise = n => { const v = Math.sin(n * 12.9898) * 43758.5453; return v - Math.floor(v); };
const wob = (seed, a = 2) => ((noise(seed) - .5) * a).toFixed(1);
const cx = c => c % N * 32 + 16, cy = c => Math.floor(c / N) * 32 + 16;
function shipBox(cells, pad) {
  const xs = cells.map(c => c % N), ys = cells.map(c => Math.floor(c / N));
  return { x0: Math.min(...xs) * 32 + pad, y0: Math.min(...ys) * 32 + pad, x1: (Math.max(...xs) + 1) * 32 - pad, y1: (Math.max(...ys) + 1) * 32 - pad };
}
function penRect(b, seed) {
  const o = 2.2, w = i => +wob(seed + i, 2.4);
  return `M${b.x0 - o} ${b.y0 + w(1)}L${b.x1 + o} ${b.y0 + w(2)}M${b.x1 + w(3)} ${b.y0 - o}L${b.x1 + w(4)} ${b.y1 + o}M${b.x1 + o} ${b.y1 + w(5)}L${b.x0 - o} ${b.y1 + w(6)}M${b.x0 + w(7)} ${b.y1 + o}L${b.x0 + w(8)} ${b.y0 - o}`;
}
const svgShip = cells => `<path class="s-ship" d="${penRect(shipBox(cells, 4), cells[0])}"/>`;
function svgSunk(cells, id) {
  const b = shipBox(cells, 4);
  return `<rect x="${b.x0}" y="${b.y0}" width="${b.x1 - b.x0}" height="${b.y1 - b.y0}" fill="url(#${id})"/><path class="s-sunk" fill="none" d="${penRect(b, cells[0] + 7)}"/>`;
}
function svgMark(m) {
  const x = cx(m.c), y = cy(m.c), f = m.fresh ? ' fresh' : '', s = m.c + 1;
  if (m.t === 'hit') {
    const r = 9.5;
    const l1 = `M${x - r + +wob(s, 3)} ${y - r + +wob(s + 1, 3)}L${x + r + +wob(s + 2, 3)} ${y + r + +wob(s + 3, 3)}`;
    const l2 = `M${x + r + +wob(s + 4, 3)} ${y - r + +wob(s + 5, 3)}L${x - r + +wob(s + 6, 3)} ${y + r + +wob(s + 7, 3)}`;
    return `<path class="m-hit${f}" pathLength="1" d="${l1}"/><path class="m-hit${f}" pathLength="1" d="${l2}"/>`;
  }
  if (m.t === 'miss') return `<circle class="m-miss${f}" cx="${+x + +wob(s, 3)}" cy="${+y + +wob(s + 1, 3)}" r="3.6"/>`;
  if (m.t === 'auto') return `<circle class="m-auto" cx="${x}" cy="${y}" r="2.1"/>`;
  return `<circle class="m-wait" cx="${x}" cy="${y}" r="9"/>`;
}

function makeBoard(host, label, shoot) {
  const id = 'h' + (++boardUid);
  const root = document.createElement('div');
  root.className = 'board';
  root.setAttribute('aria-label', label);
  root.setAttribute('role', 'group');
  const letters = [...LET].map(l => `<span>${l}</span>`).join('');
  const nums = Array.from({ length: N }, (_, i) => `<span>${i + 1}</span>`).join('');
  const tag = shoot ? 'button' : 'div';
  let cells = '';
  for (let c = 0; c < N * N; c++) {
    cells += shoot
      ? `<button type="button" class="cell" data-c="${c}" tabindex="${c ? -1 : 0}" aria-label="${coord(c)}"></button>`
      : `<${tag} class="cell" data-c="${c}"></${tag}>`;
  }
  root.innerHTML = `<span></span><div class="letters" aria-hidden="true">${letters}</div><div class="nums" aria-hidden="true">${nums}</div>
    <div class="field"><div class="cells">${cells}</div><svg viewBox="0 0 320 320" aria-hidden="true"></svg></div>`;
  host.appendChild(root);
  const field = root.querySelector('.field'), svg = root.querySelector('svg');
  const defs = `<defs><pattern id="${id}" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="s-hatch" x1="0" y1="0" x2="0" y2="7"/></pattern></defs>`;
  let lastHtml = '';
  return {
    root, field,
    cell: c => field.querySelector(`[data-c="${c}"]`),
    draw({ ships = [], sunk = [], rest = [], marks = [], ghost = null, ghostBad = false, lastShot = -1 }) {
      let h = defs;
      h += rest.map(s => `<path class="s-rest" d="${penRect(shipBox(s, 4), s[0])}"/>`).join('');
      h += ships.map(svgShip).join('');
      h += sunk.map(s => svgSunk(s, id)).join('');
      h += marks.map(svgMark).join('');
      if (lastShot >= 0) h += `<rect class="m-last" x="${lastShot % N * 32 + 2}" y="${Math.floor(lastShot / N) * 32 + 2}" width="28" height="28"/>`;
      if (ghost) h += `<path class="s-ghost${ghostBad ? ' bad' : ''}" d="${penRect(shipBox(ghost, 4), 1)}"/>`;
      if (h !== lastHtml) { svg.innerHTML = h; lastHtml = h; }
    }
  };
}

/* ---------- Game screen ---------- */
let V = null, drag = null, setupMsg = '', lastLogged = 0, animatedKey = '';
function buildGame() {
  app.innerHTML = `
    <header class="top">
      <span class="name">Морской бой</span>
      <span class="chips" id="chips"></span>
      <button class="btn quiet" id="exit" type="button">В меню</button>

    <section class="arena" id="arena">
      <div class="col enemy"><h2>Поле соперника</h2><div id="b-enemy"></div><div class="tally" id="t-enemy" aria-hidden="true"></div></div>
      <div class="col own">

  const q = id => app.querySelector('#' + id);
  V = { arena: q('arena'), big: q('st-big'), sub: q('st-sub'), status: q('status'), end: q('end'), setup: q('setup'), chips: q('chips'), log: q('log'), tE: q('t-enemy'), tO: q('t-own') };
  V.enemy = makeBoard(q('b-enemy'), 'Поле соперника', true);
  V.own = makeBoard(q('b-own'), 'Твоё поле', false);
  q('exit').onclick = leave;
  V.setupKey = '';
  animatedKey = '';
  drag = null; setupMsg = '';
  V.enemy.field.addEventListener('click', e => {
    const b = e.target.closest('.cell');
    if (b) fire(+b.dataset.c);
  });
  V.enemy.field.addEventListener('keydown', e => {
    const b = e.target.closest('.cell');
    if (!b) return;
    const c = +b.dataset.c, d = { ArrowLeft: c % N ? -1 : 0, ArrowRight: c % N < 9 ? 1 : 0, ArrowUp: c >= N ? -N : 0, ArrowDown: c < 90 ? N : 0 }[e.key];
    if (d === undefined) return;
    e.preventDefault();
    if (!d) return;
    b.tabIndex = -1;
    const n = V.enemy.cell(c + d);
    n.tabIndex = 0; n.focus();

function fire(c) {
  const o = oppNow();
  if (!(S.me.ready && o.ready)) return;
  const d = derive(S.me, o, firstRole(S.me.g) === S.role);
  if (d.turn !== 'a' || d.waiting || d.winner) return;
  if (knownCells(o).has(c)) return;
  S.me.shots.push(c);
  commit();
}
function knownCells(o) {
  const k = new Set(S.me.shots);
  o.sunk.forEach(s => s.forEach(c => around(c).forEach(a => k.add(a))));
  return k;
}

/* Placement: drag a ship to move it, tap it to turn it. */
const cellFromEvent = (field, e) => {
  const r = field.getBoundingClientRect();
  const x = Math.max(0, Math.min(N - 1, Math.floor((e.clientX - r.left) / r.width * N)));
  const y = Math.max(0, Math.min(N - 1, Math.floor((e.clientY - r.top) / r.height * N)));
  return y * N + x;
};
function bindPlacement(field) {
  field.addEventListener('pointerdown', e => {
    if (!S || S.me.ready || e.button) return;
    const c = cellFromEvent(field, e), idx = S.me.fleet.findIndex(s => s.includes(c));
    if (idx < 0) return;
    const ship = S.me.fleet[idx];
    drag = { idx, grab: c, ship, moved: false, ghost: ship, bad: false, last: c, pointer: e.pointerId };
    try { field.setPointerCapture(e.pointerId); } catch {}
    field.classList.add('dragging');
    e.preventDefault();
  });
  field.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.pointer) return;
    const c = cellFromEvent(field, e);
    if (c === drag.last) return;
    drag.last = c; drag.moved = true;
    const others = S.me.fleet.filter((_, i) => i !== drag.idx);
    const dx = c % N - drag.grab % N, dy = Math.floor(c / N) - Math.floor(drag.grab / N);
    const xs = drag.ship.map(s => s % N), ys = drag.ship.map(s => Math.floor(s / N));
    const ax = Math.max(-Math.min(...xs), Math.min(N - 1 - Math.max(...xs), dx));
    const ay = Math.max(-Math.min(...ys), Math.min(N - 1 - Math.max(...ys), dy));
    drag.ghost = drag.ship.map(s => s + ax + ay * N);
    drag.bad = !pieceFits(drag.ghost, others);
    renderOwn();
  });
  const finish = e => {
    if (!drag || e.pointerId !== drag.pointer) return;
    const { idx, moved, ghost, bad, ship, grab } = drag;
    drag = null;
    field.classList.remove('dragging');
    const others = S.me.fleet.filter((_, i) => i !== idx);
    if (e.type === 'pointercancel') { renderOwn(); return; }
    if (moved) {
      if (bad) complain('Сюда нельзя: корабли не должны касаться даже углами.');
      else { S.me.fleet[idx] = ghost; setupMsg = ''; store(); }
    } else if (ship.length > 1) {
      const vertical = ship[1] - ship[0] === N;
      const gx = grab % N, gy = Math.floor(grab / N), pos = ship.indexOf(grab);
      let turned = null;
      for (let shift = 0; shift < ship.length && !turned; shift++) {
        for (const off of [pos - shift, pos + shift]) {
          const t = vertical ? lay(gx - off, gy, ship.length, false) : lay(gx, gy - off, ship.length, true);
          if (t && pieceFits(t, others)) { turned = t; break; }
        }
      }
      if (turned) { S.me.fleet[idx] = turned; setupMsg = ''; store(); }
      else complain('Здесь не развернуть: мешают соседние корабли.');
    }
    render();
  };
  field.addEventListener('pointerup', finish);
  field.addEventListener('pointercancel', finish);
}
function complain(text) {
  setupMsg = text;
  const f = V.own.field;
  f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake');
}

function renderOwn() {
  const o = oppNow(), me = S.me;
  const marks = [], d = (me.ready && o.ready) ? derive(me, o, firstRole(me.g) === S.role) : null;
  if (d) {
    const seen = new Set();
    d.events.filter(e => e.who === 'b').forEach(e => {
      if (!seen.has(e.c)) { seen.add(e.c); marks.push({ c: e.c, t: e.r ? 'hit' : 'miss' }); }
    });
  }
  const opts = { ships: me.fleet.filter(s => !me.sunk.some(x => x[0] === s[0])), sunk: me.sunk, marks };
  if (d && d.last && d.last.who === 'b') opts.lastShot = d.last.c;
  if (drag && drag.moved) { opts.ghost = drag.ghost; opts.ghostBad = drag.bad; }
  V.own.draw(opts);
}

const RES = ['мимо', 'ранен', 'убит'];
const tallyHtml = sunk => {
  const left = [...sunk.map(s => s.length)];
  return FLEET.map(len => {
    const i = left.indexOf(len), dead = i >= 0;
    if (dead) left.splice(i, 1);
    return `<b class="${dead ? 'dead' : ''}">${'<i></i>'.repeat(len)}</b>`;
  }).join('');
};

function render() {
  if (!S || !V) return;
  renderChips();
  if (S.netError) {
    connectToken++; if (T) T.close(); T = null; S = null;
    netBlocked = true;
    renderHome();
    return;
  }
  if (S.full) {
    connectToken++; if (T) T.close(); T = null; S = null;
    renderHome('В этой игре уже два игрока. Проверь код или создай новую игру.');
    return;
  }
  const me = S.me, o = oppNow(), both = me.ready && o.ready;
  V.arena.dataset.phase = both ? 'battle' : 'place';
  V.own.field.classList.toggle('setup', !me.ready);
  renderOwn();
  if (!both) { renderSetup(o); return; }

  /* Battle */
  const d = derive(me, o, firstRole(me.g) === S.role);
  const myTurn = d.turn === 'a' && !d.waiting && !d.winner;
  const known = knownCells(o);

  const marks = [], hitSet = new Set(), seen = new Set();
  d.events.filter(e => e.who === 'a').forEach(e => {
    if (seen.has(e.c)) return;
    seen.add(e.c);
    marks.push({ c: e.c, t: e.r ? 'hit' : 'miss' });
    if (e.r) hitSet.add(e.c);
  });
  o.sunk.forEach(s => s.forEach(c => around(c).forEach(a => {
    if (!seen.has(a) && !s.includes(a) && !marks.some(m => m.c === a)) marks.push({ c: a, t: 'auto' });
  })));
  if (d.waiting && d.turn === 'a') marks.push({ c: me.shots[o.ans.length], t: 'wait' });
  const lastKey = d.last ? `${me.g}:${d.events.length}` : '';
  if (d.last && d.last.who === 'a' && lastKey !== animatedKey) {
    marks.forEach(m => { if (m.c === d.last.c) m.fresh = true; });
  }
  const opts = { marks, sunk: o.sunk };
  if (d.last && d.last.who === 'a') opts.lastShot = d.last.c;
  if (d.winner && o.reveal) opts.rest = o.reveal.filter(s => !o.sunk.some(x => x[0] === s[0]));
  V.enemy.draw(opts);
  animatedKey = lastKey;

  V.enemy.field.classList.toggle('armed', myTurn);
  for (let c = 0; c < N * N; c++) {
    const b = V.enemy.cell(c), open = myTurn && !known.has(c);
    b.dataset.open = open ? '1' : '0';
    b.setAttribute('aria-disabled', open ? 'false' : 'true');
    const m = marks.find(x => x.c === c);
    b.setAttribute('aria-label', coord(c) + (m ? (m.t === 'hit' ? ', попадание' : ', пусто') : ''));
  }
  V.tE.innerHTML = tallyHtml(o.sunk);
  V.tO.innerHTML = tallyHtml(me.sunk);
  V.log.innerHTML = d.events.slice(-5).reverse().map(e =>
    `<li>${e.who === 'a' ? 'Ты' : 'Соперник'}: ${coord(e.c)}, ${RES[e.r]}</li>`).join('');

  /* Headline */
  V.status.classList.toggle('mine', myTurn);
  const l = d.last;
  let big, sub = '';
  if (d.winner) {
    big = d.winner === 'a' ? 'Победа!' : 'Поражение';
    sub = d.winner === 'a' ? 'Весь флот соперника на дне.' : (o.reveal ? 'Пунктиром показаны корабли, которые ты не нашёл.' : 'Весь твой флот на дне.');
  } else if (d.waiting && d.turn === 'a') {
    big = `Выстрел в ${coord(me.shots[o.ans.length])}…`;
    sub = 'Ждём ответ соперника';
  } else if (myTurn) {
    big = 'Твой ход';
    if (l && l.who === 'a' && l.r === 1) sub = `${coord(l.c)}: ранен. Стреляй ещё.`;
    else if (l && l.who === 'a' && l.r === 2) sub = `${coord(l.c)}: убит. Стреляй ещё.`;
    else if (l && l.who === 'b') sub = `Соперник стрелял в ${coord(l.c)}: мимо.`;
    else sub = 'Выбери клетку на поле соперника.';
  } else {
    big = 'Ход соперника';
    if (l && l.who === 'a') sub = `${coord(l.c)}: мимо.`;
    else if (l && l.who === 'b') sub = `Попал в ${coord(l.c)}: ${RES[l.r]}. Стреляет ещё раз.`;
    else sub = 'Первый выстрел за ним.';
  }
  V.big.textContent = big;
  V.sub.textContent = sub;
  setTitle(myTurn, d.winner);

  /* End of round */
  V.end.hidden = !d.winner;
  if (d.winner) {
    const asked = me.rematch === me.g + 1, askedBy = o.rematch === me.g + 1;
    const html = `<button class="btn main" id="rematch" type="button"${asked ? ' disabled' : ''}>${askedBy && !asked ? 'Принять реванш' : asked ? 'Ждём соперника…' : 'Реванш'}</button>${askedBy && !asked ? '<span class="hint">Соперник хочет сыграть ещё раз.</span>' : ''}`;
    if (V.end.dataset.h !== html) {
      V.end.dataset.h = html;
      V.end.innerHTML = html;
      const btn = V.end.querySelector('#rematch');
      if (btn) btn.onclick = () => { S.me.rematch = S.me.g + 1; commit(); sync(); };
    }
  } else if (V.end.dataset.h) { V.end.dataset.h = ''; V.end.innerHTML = ''; }
}

function renderSetup(o) {
  const me = S.me, heard = !!S.opp, isNet = S.mode === 'net';
  V.status.classList.remove('mine');
  V.end.hidden = true;
  V.enemy.field.classList.remove('armed');
  if (!me.ready) {
    V.big.textContent = 'Расставь корабли';
    V.sub.textContent = setupMsg || 'Перетащи корабль, чтобы передвинуть. Нажми на него, чтобы развернуть.';
  } else {
    V.big.textContent = heard ? 'Соперник ещё расставляет' : 'Ждём соперника';
    V.sub.textContent = 'Ты готов. Бой начнётся, как только соперник нажмёт «В бой».';
  }
  setTitle(false, false);
  const inviteNeeded = isNet && S.role === 'host' && !heard;
  const state = [me.g, me.ready, inviteNeeded, heard, o.ready, S.code].join('|');
  if (V.setupKey === state) return;
  V.setupKey = state;
  const opener = firstRole(me.g) === S.role ? 'Первый выстрел за тобой.' : 'Первый выстрел за соперником.';
  V.setup.innerHTML = `
    ${inviteNeeded ? `
      <div class="invite">
        <h3 style="font-size:22px">Позови друга</h3>
        <div class="num" id="the-code">${S.code}</div>
        <div class="row">
          <button class="btn" id="copy" type="button">${shareUrl() ? 'Скопировать ссылку' : 'Скопировать приглашение'}</button>
          <span class="hint" id="copied" role="status"></span>
        </div>
        <input id="copy-fallback" readonly hidden aria-label="Текст приглашения">
        <p class="hint">${shareUrl() ? 'Друг откроет ссылку и сразу попадёт в игру.' : inClaude ? 'Друг откроет эту страницу и введёт код.' : 'Друг откроет этот же файл игры и введёт код.'}</p>
      </div>` : ''}
    ${isNet && S.role === 'guest' && !heard ? `<p class="hint">Соперник пока не появился. Если так и не появится, проверь код: ${S.code}.</p>` : ''}
    ${!me.ready ? `
      <div class="row">
        <button class="btn main" id="ready" type="button">В бой</button>
        <button class="btn" id="shuffle" type="button">Расставить заново</button>
      </div>
      <div class="steps">
        <div>Флот: один четырёхпалубный, два трёхпалубных, три двухпалубных и четыре однопалубных.</div>
        <div>Попал — стреляешь ещё раз. ${opener}</div>
      </div>` : `<p class="hint">${opener}</p>`}`;
  const q = id => V.setup.querySelector('#' + id);
  if (q('ready')) q('ready').onclick = () => { S.me.ready = true; setupMsg = ''; commit(); sync(); };
  if (q('shuffle')) q('shuffle').onclick = () => { S.me.fleet = randomFleet(); setupMsg = ''; store(); render(); };
  if (q('copy')) q('copy').onclick = doCopy;
}

function shareUrl() {
  if (inClaude || !/^https?:$/.test(location.protocol)) return '';
  return location.href.split('#')[0] + '#' + S.code;
}
function doCopy() {
  const url = shareUrl();
  const text = url || `Сыграем в морской бой? Открой файл игры, нажми «Войти в игру» и введи код ${S.code}`;
  const done = () => { const c = V.setup.querySelector('#copied'); if (c) c.textContent = 'Скопировано'; };
  const manual = () => {
    const f = V.setup.querySelector('#copy-fallback');
    if (!f) return;
    f.hidden = false; f.value = text; f.focus(); f.select();
    const c = V.setup.querySelector('#copied'); if (c) c.textContent = 'Скопируй текст вручную:';
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, manual);
  else manual();
}

function renderChips() {
  if (!S || !V || !V.chips.isConnected) return;
  let html = '';
  if (S.mode === 'bot') html = `<span class="chip on"><i></i>Тренировка с компьютером</span>`;
  else {
    const linked = T && T.linked(), peer = T && T.peerOnline();
    html = `<span class="chip">Игра ${S.code}</span>`;
    html += linked ? `<span class="chip on"><i></i>Связь есть</span>` : `<span class="chip off"><i></i>Подключаюсь…</span>`;
    html += peer ? `<span class="chip on"><i></i>Соперник в сети</span>` : `<span class="chip"><i></i>Соперник не в сети</span>`;
    if (!linked && Date.now() - (S.linkT = S.linkT || Date.now()) > 15000) html += `<span class="chip off">Не удаётся связаться с сервером игры. Проверь интернет или попробуй другую сеть.</span>`;
    if (linked) S.linkT = 0;
  }
  if (V.chips.dataset.h !== html) { V.chips.dataset.h = html; V.chips.innerHTML = html; }
}
function setTitle(myTurn, winner) {
  document.title = document.hidden && myTurn ? '● Твой ход' : document.hidden && winner ? 'Партия окончена' : BASE_TITLE;
}
document.addEventListener('visibilitychange', () => { if (S) render(); });

/* ---------- Boot ---------- */
async function boot() {
  const hash = (location.hash || '').slice(1), tabS = load('sessionStorage', 'mb:tab');
  renderHome();
  if (inClaude) {
    try {
      const room = await window.claude.use('room');
      if (!room) throw 0;
      await new Promise((ok, no) => {
        const off = room.onConnection(() => {}, e => no(e));
        setTimeout(() => { ok(); off(); }, 1500);
      });
    } catch { netBlocked = true; if (!S) renderHome(); return; }
  }
  if (S) return;
  if (tabS && (!/^\d{6}$/.test(hash) || hash === tabS.code) && resume(tabS.code, tabS.role)) return;
  if (/^\d{6}$/.test(hash)) joinCode(hash);
}
boot();
})();
</script>
